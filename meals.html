<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meals - FitTrack Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #00ff88;
            --accent: #ff0080;
            --dark: #0a0e27;
            --dark-light: #1a1f3a;
            --dark-lighter: #2a2f4a;
            --gray: #8b93b8;
            --danger: #ff4757;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--dark);
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            background: rgba(26, 31, 58, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
        }

        .logo i {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 12px 24px;
            color: var(--gray);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover {
            background: var(--dark-lighter);
            color: #ffffff;
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .calorie-card {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .calorie-card h3 {
            font-size: 24px;
            margin-bottom: 24px;
            font-weight: 800;
        }

        .bar-progress {
            margin: 20px 0;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 15px;
            color: var(--gray);
        }

        .bar-label strong {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        .bar-track {
            height: 14px;
            background: var(--dark-lighter);
            border-radius: 10px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 10px;
            transition: width 1s ease;
        }

        .meal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 30px;
        }

        .meal-card {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 32px;
            transition: all 0.3s ease;
        }

        .meal-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .meal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 20px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }

        .meal-title {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 22px;
            font-weight: 800;
        }

        .meal-icon {
            font-size: 28px;
        }

        .meal-calories {
            font-size: 18px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .meal-items {
            display: grid;
            gap: 14px;
            margin-bottom: 20px;
        }

        .meal-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: var(--dark-lighter);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .meal-item:hover {
            border-color: var(--primary);
        }

        .item-name {
            font-size: 15px;
            font-weight: 600;
        }

        .item-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .item-calories {
            font-size: 14px;
            color: var(--gray);
        }

        .delete-btn {
            background: transparent;
            border: none;
            color: var(--danger);
            cursor: pointer;
            font-size: 18px;
            padding: 6px;
            transition: all 0.3s ease;
            border-radius: 8px;
        }

        .delete-btn:hover {
            background: rgba(255, 71, 87, 0.1);
            transform: scale(1.15);
        }

        .add-meal-btn {
            width: 100%;
            padding: 14px;
            background: transparent;
            border: 2px dashed rgba(255, 255, 255, 0.1);
            color: var(--gray);
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 15px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .add-meal-btn:hover {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: var(--dark);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-link span {
                display: none;
            }

            .container {
                padding: 24px;
            }

            .meal-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <i class="fas fa-dumbbell"></i>
                <span>FitTrack Pro</span>
            </a>
            <nav>
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="activities.html" class="nav-link">
                    <i class="fas fa-running"></i>
                    <span>Activities</span>
                </a>
                <a href="meals.html" class="nav-link active">
                    <i class="fas fa-utensils"></i>
                    <span>Meals</span>
                </a>
                <a href="insights.html" class="nav-link">
                    <i class="fas fa-chart-bar"></i>
                    <span>Insights</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="calorie-card">
            <h3>Daily Calorie Intake</h3>
            <div class="bar-progress">
                <div class="bar-label">
                    <span>Total Calories</span>
                    <span><strong id="totalMealCalories">0</strong> / 2000 kcal</span>
                </div>
                <div class="bar-track">
                    <div class="bar-fill" id="mealCaloriesBar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div class="meal-grid" id="mealGrid"></div>
    </div>

    <script>
        const initialMeals = {
            breakfast: [
                { id: 1, name: 'Oatmeal with Berries', calories: 320 },
                { id: 2, name: 'Greek Yogurt', calories: 150 },
                { id: 3, name: 'Orange Juice', calories: 110 }
            ],
            lunch: [
                { id: 4, name: 'Grilled Chicken Salad', calories: 450 },
                { id: 5, name: 'Quinoa Bowl', calories: 380 },
                { id: 6, name: 'Green Smoothie', calories: 180 }
            ],
            dinner: [
                { id: 7, name: 'Salmon with Vegetables', calories: 520 },
                { id: 8, name: 'Brown Rice', calories: 220 },
                { id: 9, name: 'Steamed Broccoli', calories: 55 }
            ]
        };

        let meals = JSON.parse(sessionStorage.getItem('meals')) || initialMeals;
        let mealIdCounter = Math.max(...Object.values(meals).flat().map(m => m.id), 0) + 1;

        function renderMeals() {
            const mealGrid = document.getElementById('mealGrid');
            const mealTypes = [
                { key: 'breakfast', title: 'Breakfast', icon: '🌅' },
                { key: 'lunch', title: 'Lunch', icon: '☀️' },
                { key: 'dinner', title: 'Dinner', icon: '🌙' }
            ];

            mealGrid.innerHTML = mealTypes.map(mealType => {
                const mealItems = meals[mealType.key] || [];
                const totalCalories = mealItems.reduce((sum, item) => sum + item.calories, 0);

                return `
                    <div class="meal-card">
                        <div class="meal-header">
                            <div class="meal-title">
                                <span class="meal-icon">${mealType.icon}</span>
                                <span>${mealType.title}</span>
                            </div>
                            <div class="meal-calories">${totalCalories} kcal</div>
                        </div>
                        <div class="meal-items">
                            ${mealItems.map(item => `
                                <div class="meal-item">
                                    <span class="item-name">${item.name}</span>
                                    <div class="item-info">
                                        <span class="item-calories">${item.calories} kcal</span>
                                        <button class="delete-btn" onclick="deleteMeal('${mealType.key}', ${item.id})">
                                            <i class="fas fa-times"></i>
                                        </button>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                        <button class="add-meal-btn" onclick="addMeal('${mealType.key}')">
                            <i class="fas fa-plus"></i> Add Item
                        </button>
                    </div>
                `;
            }).join('');

            updateMealCalories();
        }

        function updateMealCalories() {
            const totalCalories = Object.values(meals)
                .flat()
                .reduce((sum, item) => sum + item.calories, 0);

            document.getElementById('totalMealCalories').textContent = totalCalories;
            
            const percent = Math.min((totalCalories / 2000) * 100, 100);
            document.getElementById('mealCaloriesBar').style.width = percent + '%';
        }

        function addMeal(mealType) {
            const name = prompt('Enter meal item name:');
            if (!name || !name.trim()) return;

            const calories = parseInt(prompt('Enter calories:'));
            if (!calories || calories <= 0 || isNaN(calories)) {
                alert('Please enter a valid calorie amount');
                return;
            }

            const newMeal = {
                id: mealIdCounter++,
                name: name.trim(),
                calories
            };

            meals[mealType].push(newMeal);
            sessionStorage.setItem('meals', JSON.stringify(meals));
            renderMeals();
        }

        function deleteMeal(mealType, mealId) {
            if (confirm('Are you sure you want to delete this meal item?')) {
                meals[mealType] = meals[mealType].filter(m => m.id !== mealId);
                sessionStorage.setItem('meals', JSON.stringify(meals));
                renderMeals();
            }
        }

        renderMeals();
    </script>
</body>
</html>
