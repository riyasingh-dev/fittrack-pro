<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insights - FitTrack Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #00ff88;
            --accent: #ff0080;
            --dark: #0a0e27;
            --dark-light: #1a1f3a;
            --dark-lighter: #2a2f4a;
            --gray: #8b93b8;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--dark);
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            background: rgba(26, 31, 58, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
        }

        .logo i {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 12px 24px;
            color: var(--gray);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover {
            background: var(--dark-lighter);
            color: #ffffff;
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .summary-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 36px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            border-color: var(--primary);
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 212, 255, 0.2);
        }

        .stat-card-icon {
            font-size: 44px;
            margin-bottom: 16px;
        }

        .stat-card-value {
            font-size: 36px;
            font-weight: 900;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .stat-card-label {
            font-size: 15px;
            color: var(--gray);
        }

        .chart-container {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 32px;
        }

        .chart-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 40px;
        }

        .chart-bars {
            display: flex;
            align-items: flex-end;
            justify-content: space-around;
            height: 340px;
            gap: 20px;
        }

        .chart-bar {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }

        .bar {
            width: 100%;
            max-width: 70px;
            background: linear-gradient(180deg, var(--primary), var(--secondary));
            border-radius: 12px 12px 0 0;
            position: relative;
            transition: all 0.5s ease;
        }

        .bar:hover {
            transform: scale(1.05);
            box-shadow: 0 -10px 30px rgba(0, 212, 255, 0.4);
        }

        .bar-value {
            position: absolute;
            top: -36px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bar-label {
            font-size: 15px;
            font-weight: 700;
            color: var(--gray);
        }

        .actions {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 16px 36px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 212, 255, 0.3);
        }

        .btn-secondary {
            background: var(--dark-lighter);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        .btn-secondary:hover {
            border-color: var(--primary);
            transform: translateY(-3px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            font-size: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .modal-text {
            font-size: 16px;
            color: var(--gray);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 16px 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 212, 255, 0.3);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-link span {
                display: none;
            }

            .container {
                padding: 24px;
            }

            .chart-bars {
                height: 280px;
                gap: 12px;
            }

            .bar {
                max-width: 50px;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <i class="fas fa-dumbbell"></i>
                <span>FitTrack Pro</span>
            </a>
            <nav>
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="activities.html" class="nav-link">
                    <i class="fas fa-running"></i>
                    <span>Activities</span>
                </a>
                <a href="meals.html" class="nav-link">
                    <i class="fas fa-utensils"></i>
                    <span>Meals</span>
                </a>
                <a href="insights.html" class="nav-link active">
                    <i class="fas fa-chart-bar"></i>
                    <span>Insights</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="summary-stats">
            <div class="stat-card">
                <div class="stat-card-icon">🏃</div>
                <div class="stat-card-value" id="totalActivities">0</div>
                <div class="stat-card-label">Total Activities</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon">⏱️</div>
                <div class="stat-card-value" id="totalMinutes">0</div>
                <div class="stat-card-label">Total Minutes</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon">🔥</div>
                <div class="stat-card-value" id="totalCaloriesBurned">0</div>
                <div class="stat-card-label">Calories Burned</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon">🍽️</div>
                <div class="stat-card-value" id="totalMeals">0</div>
                <div class="stat-card-label">Total Meals</div>
            </div>
        </div>

        <div class="chart-container">
            <h3 class="chart-title">Weekly Activity Summary</h3>
            <div class="chart-bars" id="weeklyActivityChart"></div>
        </div>

        <div class="chart-container">
            <h3 class="chart-title">Weekly Calorie Burn</h3>
            <div class="chart-bars" id="weeklyCalorieChart"></div>
        </div>

        <div class="actions">
            <button class="btn btn-primary" onclick="downloadSummary()">
                <i class="fas fa-download"></i> Download Summary
            </button>
            <button class="btn btn-secondary" onclick="resetDashboard()">
                <i class="fas fa-redo"></i> Reset Dashboard
            </button>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-check"></i>
            </div>
            <h3 class="modal-title">Success!</h3>
            <p class="modal-text" id="modalText">Operation completed successfully!</p>
            <button class="modal-btn" onclick="closeModal()">Got it!</button>
        </div>
    </div>

    <script>
        const initialActivities = [
            { id: 1, name: 'Morning Yoga', duration: 30, calories: 150, time: 'morning', icon: 'fa-spa' },
            { id: 2, name: 'Cycling', duration: 45, calories: 380, time: 'afternoon', icon: 'fa-bicycle' },
            { id: 3, name: 'Evening Walk', duration: 25, calories: 120, time: 'evening', icon: 'fa-walking' },
            { id: 4, name: 'Weight Training', duration: 50, calories: 420, time: 'morning', icon: 'fa-dumbbell' },
            { id: 5, name: 'Swimming', duration: 40, calories: 350, time: 'afternoon', icon: 'fa-swimmer' }
        ];

        const initialMeals = {
            breakfast: [
                { id: 1, name: 'Oatmeal with Berries', calories: 320 },
                { id: 2, name: 'Greek Yogurt', calories: 150 },
                { id: 3, name: 'Orange Juice', calories: 110 }
            ],
            lunch: [
                { id: 4, name: 'Grilled Chicken Salad', calories: 450 },
                { id: 5, name: 'Quinoa Bowl', calories: 380 },
                { id: 6, name: 'Green Smoothie', calories: 180 }
            ],
            dinner: [
                { id: 7, name: 'Salmon with Vegetables', calories: 520 },
                { id: 8, name: 'Brown Rice', calories: 220 },
                { id: 9, name: 'Steamed Broccoli', calories: 55 }
            ]
        };

        let activities = JSON.parse(sessionStorage.getItem('activities')) || initialActivities;
        let meals = JSON.parse(sessionStorage.getItem('meals')) || initialMeals;

        const weeklyData = {
            activities: [12, 15, 18, 14, 20, 16, 19],
            calories: [1800, 2100, 2400, 1900, 2600, 2200, 2500]
        };

        const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

        function updateInsights() {
            const totalActivities = activities.length;
            const totalMinutes = activities.reduce((sum, a) => sum + a.duration, 0);
            const totalCaloriesBurned = activities.reduce((sum, a) => sum + a.calories, 0);
            const totalMeals = Object.values(meals).flat().length;

            document.getElementById('totalActivities').textContent = totalActivities;
            document.getElementById('totalMinutes').textContent = totalMinutes;
            document.getElementById('totalCaloriesBurned').textContent = totalCaloriesBurned.toLocaleString();
            document.getElementById('totalMeals').textContent = totalMeals;

            const activityChart = document.getElementById('weeklyActivityChart');
            const maxActivity = Math.max(...weeklyData.activities);
            
            activityChart.innerHTML = weeklyData.activities.map((value, index) => {
                const height = (value / maxActivity) * 100;
                return `
                    <div class="chart-bar">
                        <div class="bar" style="height: ${height}%">
                            <div class="bar-value">${value}</div>
                        </div>
                        <div class="bar-label">${days[index]}</div>
                    </div>
                `;
            }).join('');

            const calorieChart = document.getElementById('weeklyCalorieChart');
            const maxCalories = Math.max(...weeklyData.calories);
            
            calorieChart.innerHTML = weeklyData.calories.map((value, index) => {
                const height = (value / maxCalories) * 100;
                return `
                    <div class="chart-bar">
                        <div class="bar" style="height: ${height}%">
                            <div class="bar-value">${value}</div>
                        </div>
                        <div class="bar-label">${days[index]}</div>
                    </div>
                `;
            }).join('');
        }

        function downloadSummary() {
            const summary = `
FitTrack Pro - Fitness Summary
==============================

Activities (${activities.length}):
${activities.map(a => `- ${a.name}: ${a.duration} mins, ${a.calories} kcal (${a.time})`).join('\n')}

Total Activity Time: ${activities.reduce((sum, a) => sum + a.duration, 0)} minutes
Total Calories Burned: ${activities.reduce((sum, a) => sum + a.calories, 0)} kcal

Meals:
Breakfast (${meals.breakfast.length} items): ${meals.breakfast.reduce((s, m) => s + m.calories, 0)} kcal
Lunch (${meals.lunch.length} items): ${meals.lunch.reduce((s, m) => s + m.calories, 0)} kcal
Dinner (${meals.dinner.length} items): ${meals.dinner.reduce((s, m) => s + m.calories, 0)} kcal

Total Calorie Intake: ${Object.values(meals).flat().reduce((s, m) => s + m.calories, 0)} kcal

Generated: ${new Date().toLocaleString()}
            `.trim();

            const blob = new Blob([summary], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'fittrack-summary.txt';
            a.click();
            URL.revokeObjectURL(url);

            showModal('Summary Downloaded!', 'Your fitness summary has been downloaded successfully.');
        }

        function resetDashboard() {
            if (confirm('Are you sure you want to reset all dashboard data? This will clear all activities and meals.')) {
                sessionStorage.clear();
                activities = [...initialActivities];
                meals = JSON.parse(JSON.stringify(initialMeals));
                sessionStorage.setItem('activities', JSON.stringify(activities));
                sessionStorage.setItem('meals', JSON.stringify(meals));
                
                updateInsights();
                showModal('Dashboard Reset!', 'All data has been reset to default values.');
            }
        }

        function showModal(title, text) {
            document.querySelector('.modal-title').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('successModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }

        updateInsights();
    </script>
</body>
</html>
