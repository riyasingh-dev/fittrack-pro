<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities - FitTrack Pro</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #00d4ff;
            --secondary: #00ff88;
            --accent: #ff0080;
            --dark: #0a0e27;
            --dark-light: #1a1f3a;
            --dark-lighter: #2a2f4a;
            --gray: #8b93b8;
            --success: #00ff88;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: var(--dark);
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            background: rgba(26, 31, 58, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            text-decoration: none;
        }

        .logo i {
            font-size: 32px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        nav {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            padding: 12px 24px;
            color: var(--gray);
            text-decoration: none;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .nav-link:hover {
            background: var(--dark-lighter);
            color: #ffffff;
        }

        .nav-link.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px;
        }

        .form-card {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
            margin-bottom: 40px;
        }

        .form-card h3 {
            font-size: 28px;
            margin-bottom: 32px;
            font-weight: 800;
        }

        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            margin-bottom: 10px;
            font-size: 15px;
            font-weight: 600;
            color: var(--gray);
        }

        .form-input {
            width: 100%;
            padding: 16px 20px;
            background: var(--dark-lighter);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 14px;
            font-size: 16px;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(0, 212, 255, 0.1);
        }

        .btn {
            padding: 16px 36px;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 212, 255, 0.3);
        }

        .activities-card {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 40px;
        }

        .activities-card h3 {
            font-size: 28px;
            margin-bottom: 28px;
            font-weight: 800;
        }

        .filter-buttons {
            display: flex;
            gap: 12px;
            margin-bottom: 32px;
            flex-wrap: wrap;
        }

        .filter-btn {
            padding: 12px 24px;
            background: var(--dark-lighter);
            border: 2px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: var(--gray);
            transition: all 0.3s ease;
        }

        .filter-btn:hover {
            border-color: var(--primary);
            color: #ffffff;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-color: transparent;
            color: var(--dark);
        }

        .activity-list {
            display: grid;
            gap: 20px;
        }

        .activity-item {
            background: var(--dark-lighter);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
        }

        .activity-item:hover {
            border-color: var(--primary);
            transform: translateX(8px);
            box-shadow: 0 10px 30px rgba(0, 212, 255, 0.2);
        }

        .activity-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .activity-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
        }

        .activity-details h4 {
            font-size: 18px;
            margin-bottom: 6px;
            font-weight: 700;
        }

        .activity-details p {
            font-size: 14px;
            color: var(--gray);
        }

        .activity-stats {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        .stat {
            text-align: center;
        }

        .stat-value {
            font-size: 22px;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stat-label {
            font-size: 13px;
            color: var(--gray);
            margin-top: 4px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal-content {
            background: var(--dark-light);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 48px;
            max-width: 450px;
            width: 90%;
            text-align: center;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .modal-icon {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            font-size: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
        }

        .modal-title {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 12px;
        }

        .modal-text {
            font-size: 16px;
            color: var(--gray);
            margin-bottom: 32px;
            line-height: 1.6;
        }

        .modal-btn {
            padding: 16px 48px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: var(--dark);
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(0, 212, 255, 0.3);
        }

        @media (max-width: 768px) {
            .header-content {
                flex-direction: column;
                gap: 20px;
            }

            nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .nav-link span {
                display: none;
            }

            .container {
                padding: 24px;
            }

            .activity-item {
                flex-direction: column;
                gap: 20px;
            }

            .activity-stats {
                width: 100%;
                justify-content: space-around;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">
                <i class="fas fa-dumbbell"></i>
                <span>FitTrack Pro</span>
            </a>
            <nav>
                <a href="index.html" class="nav-link">
                    <i class="fas fa-home"></i>
                    <span>Home</span>
                </a>
                <a href="dashboard.html" class="nav-link">
                    <i class="fas fa-chart-line"></i>
                    <span>Dashboard</span>
                </a>
                <a href="activities.html" class="nav-link active">
                    <i class="fas fa-running"></i>
                    <span>Activities</span>
                </a>
                <a href="meals.html" class="nav-link">
                    <i class="fas fa-utensils"></i>
                    <span>Meals</span>
                </a>
                <a href="insights.html" class="nav-link">
                    <i class="fas fa-chart-bar"></i>
                    <span>Insights</span>
                </a>
            </nav>
        </div>
    </header>

    <div class="container">
        <div class="form-card">
            <h3><i class="fas fa-plus-circle"></i> Add New Activity</h3>
            <form id="activityForm">
                <div class="form-group">
                    <label class="form-label">Activity Name</label>
                    <input type="text" class="form-input" id="activityName" placeholder="e.g., Morning Run" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Duration (minutes)</label>
                    <input type="number" class="form-input" id="activityDuration" placeholder="e.g., 30" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Calories Burned</label>
                    <input type="number" class="form-input" id="activityCalories" placeholder="e.g., 250" min="1" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Time of Day</label>
                    <select class="form-input" id="activityTime" required>
                        <option value="">Select time</option>
                        <option value="morning">Morning</option>
                        <option value="afternoon">Afternoon</option>
                        <option value="evening">Evening</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-plus"></i> Add Activity
                </button>
            </form>
        </div>

        <div class="activities-card">
            <h3>Today's Activities</h3>
            <div class="filter-buttons">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="morning">Morning</button>
                <button class="filter-btn" data-filter="afternoon">Afternoon</button>
                <button class="filter-btn" data-filter="evening">Evening</button>
            </div>
            <div class="activity-list" id="activityList"></div>
        </div>
    </div>

    <div class="modal" id="successModal">
        <div class="modal-content">
            <div class="modal-icon">
                <i class="fas fa-check"></i>
            </div>
            <h3 class="modal-title">Success!</h3>
            <p class="modal-text" id="modalText">Activity added successfully!</p>
            <button class="modal-btn" onclick="closeModal()">Got it!</button>
        </div>
    </div>

    <script>
        const initialActivities = [
            { id: 1, name: 'Morning Yoga', duration: 30, calories: 150, time: 'morning', icon: 'fa-spa' },
            { id: 2, name: 'Cycling', duration: 45, calories: 380, time: 'afternoon', icon: 'fa-bicycle' },
            { id: 3, name: 'Evening Walk', duration: 25, calories: 120, time: 'evening', icon: 'fa-walking' },
            { id: 4, name: 'Weight Training', duration: 50, calories: 420, time: 'morning', icon: 'fa-dumbbell' },
            { id: 5, name: 'Swimming', duration: 40, calories: 350, time: 'afternoon', icon: 'fa-swimmer' }
        ];

        let activities = JSON.parse(sessionStorage.getItem('activities')) || initialActivities;
        let activityIdCounter = Math.max(...activities.map(a => a.id), 0) + 1;

        function renderActivities(filter = 'all') {
            const activityList = document.getElementById('activityList');
            const filteredActivities = filter === 'all' 
                ? activities 
                : activities.filter(a => a.time === filter);

            if (filteredActivities.length === 0) {
                activityList.innerHTML = '<p style="text-align: center; color: var(--gray); padding: 60px 20px; font-size: 16px;">No activities found for this filter</p>';
                return;
            }

            activityList.innerHTML = filteredActivities.map(activity => `
                <div class="activity-item">
                    <div class="activity-info">
                        <div class="activity-icon">
                            <i class="fas ${activity.icon}"></i>
                        </div>
                        <div class="activity-details">
                            <h4>${activity.name}</h4>
                            <p>${activity.time.charAt(0).toUpperCase() + activity.time.slice(1)}</p>
                        </div>
                    </div>
                    <div class="activity-stats">
                        <div class="stat">
                            <div class="stat-value">${activity.duration}</div>
                            <div class="stat-label">mins</div>
                        </div>
                        <div class="stat">
                            <div class="stat-value">${activity.calories}</div>
                            <div class="stat-label">kcal</div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                renderActivities(btn.dataset.filter);
            });
        });

        document.getElementById('activityForm').addEventListener('submit', (e) => {
            e.preventDefault();

            const name = document.getElementById('activityName').value.trim();
            const duration = parseInt(document.getElementById('activityDuration').value);
            const calories = parseInt(document.getElementById('activityCalories').value);
            const time = document.getElementById('activityTime').value;

            if (!name || !duration || !calories || !time) {
                alert('Please fill in all fields');
                return;
            }

            const icons = ['fa-running', 'fa-walking', 'fa-bicycle', 'fa-swimmer', 'fa-dumbbell', 'fa-spa'];
            const randomIcon = icons[Math.floor(Math.random() * icons.length)];

            const newActivity = {
                id: activityIdCounter++,
                name,
                duration,
                calories,
                time,
                icon: randomIcon
            };

            activities.push(newActivity);
            sessionStorage.setItem('activities', JSON.stringify(activities));

            document.getElementById('activityForm').reset();
            renderActivities('all');
            document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
            document.querySelectorAll('.filter-btn:not([data-filter="all"])').forEach(b => b.classList.remove('active'));

            showModal('Activity Added Successfully!', `${name} has been logged and added to your tracker.`);
        });

        function showModal(title, text) {
            document.querySelector('.modal-title').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('successModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('successModal').classList.remove('active');
        }

        renderActivities('all');
    </script>
</body>
</html>
